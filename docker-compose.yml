services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jansutra
      POSTGRES_USER: jansutra
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - jansutra-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jansutra -d jansutra"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://jansutra:local-dev-only-change-me@db:5432/jansutra
      JWT_SECRET: local-compose-secret-change-before-deployment-000000000
      CORS_ORIGINS: http://localhost:3000
      MODEL_PATH: ./artifacts/grievance_classifier.joblib
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/artifacts:/srv/app/artifacts

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  jansutra-db:
